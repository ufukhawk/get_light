name: get_light
description: >-
  Lightweight Flutter state management and dependency injection from GetX,
  with reactive variables, simple state, dependency injection, and worker utilities.
version: 1.0.2
homepage: https://github.com/ufukhawk/get_light
repository: https://github.com/ufukhawk/get_light
issue_tracker: https://github.com/ufukhawk/get_light/issues

topics:
  - state-management
  - dependency-injection
  - reactive
  - getx

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
