name: get_light
description: >-
  Lightweight Flutter state management and dependency injection extracted from GetX.
  Includes reactive variables (.obs, Obx), simple state (GetBuilder, GetxController),
  DI (Get.put / Get.find / lazyPut), and workers (ever, once, debounce, interval).
version: 1.0.1
homepage: https://github.com/ufukhawk/get_light
repository: https://github.com/ufukhawk/get_light
issue_tracker: https://github.com/ufukhawk/get_light/issues

topics:
  - state-management
  - dependency-injection
  - reactive
  - getx

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
